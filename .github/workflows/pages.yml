name: Publicar Surface Lab en GitHub Pages (manual)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar web pública
        run: |
          mkdir -p _site
          cp index.html app.js parser.mjs xr-panel.mjs xr-spatial.mjs xr-table-fit.mjs mobile-usdz.mjs mobile-colors.mjs styles.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
        id: deployment
